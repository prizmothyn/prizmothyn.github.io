  <script>
  (function () {
    'use strict';
    // Tema por defecto: la ficha no lee ni escribe almacenamiento local.
    var THEME_PALETTES = {
      light: { bg: '#070a1c', surface: '#11163a', border: '#262d61' },
      dark: { bg: '#0b0722', surface: '#18123f', border: '#322a68' },
      'ultra-dark': { bg: '#04060f', surface: '#0d1029', border: '#1f2450' }
    };
    var THEME_DEFAULTS = {
      v: 2, mode: 'light', accent: '#8b5cf6',
      background: '', surface: '', border: '', size: 'medium', radius: 'medium'
    };

    function isValidHexColor(value) {
      return /^#[0-9a-f]{6}$/i.test(String(value || ''));
    }
    // Esta ficha es independiente y no escribe almacenamiento local: usa el tema
    // por defecto y recibe solo el idioma por URL (Parámetro `lang`).
    function loadThemePreferences() {
      return Object.assign({}, THEME_DEFAULTS);
    }
    function hexToRgb(hex) {
      var value = String(hex).replace('#', '');
      return {
        r: parseInt(value.slice(0, 2), 16),
        g: parseInt(value.slice(2, 4), 16),
        b: parseInt(value.slice(4, 6), 16)
      };
    }
    function blendHexColor(color, target, amount) {
      var source = hexToRgb(color), dest = hexToRgb(target);
      return '#' + ['r', 'g', 'b'].map(function (channel) {
        return Math.round(source[channel] * (1 - amount) + dest[channel] * amount)
          .toString(16).padStart(2, '0');
      }).join('');
    }
    function applySharedTheme() {
      var prefs = loadThemePreferences();
      var palette = THEME_PALETTES[prefs.mode] || THEME_PALETTES.light;
      var accent = prefs.accent;
      var background = prefs.background || palette.bg;
      var surface = prefs.surface || palette.surface;
      var border = prefs.border || palette.border;
      var bgRgb = hexToRgb(background);
      var surfaceRgb = hexToRgb(surface);
      var accentRgb = hexToRgb(accent);
      var brightness = (
        0.2126 * (bgRgb.r + surfaceRgb.r) / 2 +
        0.7152 * (bgRgb.g + surfaceRgb.g) / 2 +
        0.0722 * (bgRgb.b + surfaceRgb.b) / 2
      ) / 255;
      var lightSurface = brightness > 0.52;
      var root = document.documentElement;
      root.dataset.theme = prefs.mode;
      root.style.setProperty('--bg', background);
      root.style.setProperty('--bg-rgb', bgRgb.r + ', ' + bgRgb.g + ', ' + bgRgb.b);
      root.style.setProperty('--surface', surface);
      root.style.setProperty('--surface-2', blendHexColor(surface, accent, 0.08));
      root.style.setProperty('--line', border);
      root.style.setProperty('--text', lightSurface ? '#1a1740' : '#eef1ff');
      root.style.setProperty('--muted', lightSurface ? '#5f6592' : '#a8b0d8');
      root.style.setProperty('--brand', accent);
      root.style.setProperty('--brand-rgb', accentRgb.r + ', ' + accentRgb.g + ', ' + accentRgb.b);
      root.style.setProperty('--cyan', blendHexColor(accent, '#3b82f6', 0.35));
      root.style.setProperty('--shadow', '0 24px 70px rgba(' + bgRgb.r + ', ' + bgRgb.g + ', ' + bgRgb.b + ', .55)');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', background);
    }
    applySharedTheme();
  })();
  </script>

<script>
(function () {
  'use strict';

  // Esta ficha NO usa almacenamiento local: todo llega por ?ID= y se consulta
  // directamente a la API / PlayFab en cada carga.
  var API_URL = 'https://script.google.com/macros/s/AKfycbzG8QOsYT3RICly7rITgydaCDQtgmZSx0rvh2xnZUzc4_o0yTW21wtoHHzHWfwocSHG/exec';
  var PF = 'https://20ca2.playfabapi.com';
  var SCID = '4fc10100-5f7a-4470-899b-280835760c07';
  var KEYS_URL = 'https://toolcoin.site/api/keys.php';
  var WORKER_URL = 'assets/marketplace/worker.js';
  var CATEGORY_MAP = {
    Addon: 'Addons', Mashup: 'Addons', World: 'Mapas', SkinPack: 'Skins',
    TexturePack: 'Texturas', DLC: 'Versiones', Server: 'Scripts', Persona: 'Skins'
  };

  var params = new URLSearchParams(window.location.search);
  var idParam = String(params.get('ID') || params.get('id') || '').trim();
  var lang = params.get('lang') === 'en' ? 'en' : 'es';
  var source = idParam.indexOf('market:') === 0 ? 'market' : 'app';
  var rawId = idParam.indexOf('market:') === 0 ? idParam.slice(7)
    : idParam.indexOf('app:') === 0 ? idParam.slice(4) : idParam;
  var item = null;
  var worker = null, workerSeq = 0, keysPromise = null;
  var pending = new Map();

  function $(s) { return document.querySelector(s); }
  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function safeUrl(v) {
    if (!v) return '';
    var u = String(v).trim();
    return /^https?:\/\//i.test(u) ? esc(u) : '';
  }
  function fmt(n) { var x = Number(n); return isFinite(x) ? x.toLocaleString('es-ES') : '0'; }
  function dateLabel(v) {
    if (!v) return '';
    var d = new Date(v);
    return isNaN(d.getTime()) ? '' : d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function localText(v) {
    if (!v || typeof v !== 'object') return '';
    var keys = Object.keys(v);
    return v.neutral || v.NEUTRAL || v['en-US'] || (keys.length ? String(v[keys[0]]) : '');
  }
  function typeOf(raw) {
    var tags = Array.isArray(raw.Tags) ? raw.Tags.map(String) : [];
    if (tags.some(function (t) { return t.indexOf('persona') !== -1; })) return 'Persona';
    if (tags.indexOf('skinpack') !== -1) return 'SkinPack';
    if (tags.indexOf('worldtemplate') !== -1) return 'World';
    if (tags.indexOf('resourcepack') !== -1) return 'TexturePack';
    if (tags.indexOf('mashup') !== -1) return 'Mashup';
    if (tags.indexOf('addon') !== -1) return 'Addon';
    return String(raw.ContentType || '').indexOf('3PServerContent') !== -1 ? 'Server' : 'DLC';
  }
  function normalizeMarket(raw) {
    var dp = raw.DisplayProperties || {};
    var identity = Array.isArray(dp.packIdentity) ? dp.packIdentity[0] : null;
    var buckets = { thumb: [], icon: [], pano: [], shot: [], other: [] };
    (Array.isArray(raw.Images) ? raw.Images : []).forEach(function (img) {
      var u = safeUrl(img.Url);
      if (!u) return;
      var tag = String(img.Tag || '').toLowerCase(), type = String(img.Type || '').toLowerCase();
      var key = (tag === 'thumbnail' || type === 'thumbnail') ? 'thumb'
        : tag === 'packicon' ? 'icon' : tag === 'panorama' ? 'pano'
        : tag === 'screenshot' ? 'shot' : 'other';
      if (buckets[key].indexOf(u) === -1) buckets[key].push(u);
    });
    var imgs = buckets.thumb.concat(buckets.icon, buckets.pano, buckets.shot, buckets.other)
      .filter(function (u, i, a) { return a.indexOf(u) === i; });
    var variantes = [];
    if (Array.isArray(raw.Contents)) {
      var groups = new Map();
      raw.Contents.forEach(function (c) {
        if (!c.Url) return;
        var k = (Array.isArray(c.Tags) ? c.Tags.slice().sort().join(',') : '') || 'Standard';
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(String(c.Url));
      });
      Array.from(groups.values()).forEach(function (u) { variantes.push(u); });
    }
    var tipo = typeOf(raw);
    return {
      nombre: localText(raw.Title || dp.Title) || 'Sin título',
      version: identity && identity.version ? String(identity.version) : '',
      creador: dp.creatorName || 'Desconocido',
      categoria: CATEGORY_MAP[tipo] || 'Addons',
      likes: Number(raw.Rating && raw.Rating.Average) || 0,
      descargas: Number(raw.Rating && raw.Rating.TotalCount) || 0,
      fecha: raw.CreationDate || '',
      imagen: imgs[0] || '', imagenes: imgs,
      descripcion: localText(raw.Description),
      variantes: variantes, urlDescarga: ''
    };
  }

  // ID.html no usa localStorage: el guestId solo se necesita mientras la ficha
  // está abierta (lectura de descripciones), así que se genera en memoria.
  function getOrCreateGuestId_() {
    return 'g_' + ((window.crypto && crypto.randomUUID)
      ? crypto.randomUUID().replace(/-/g, '')
      : Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
  }
  var guestId = getOrCreateGuestId_();

  async function api(action, extra) {
    var payload = Object.assign({ action: action, guestId: guestId }, extra || {});
    var r = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload), redirect: 'follow', cache: 'no-store', credentials: 'omit'
    });
    var j = await r.json();
    if (!j || j.ok !== true) throw new Error((j && j.message) || 'Error de la API');
    return j.data;
  }
  async function pf(path, body, token) {
    var headers = { 'Content-Type': 'application/json', 'Accept-Language': 'en-US' };
    if (token) headers['X-EntityToken'] = token;
    var r = await fetch(PF + path, {
      method: 'POST', headers: headers, body: JSON.stringify(body), credentials: 'omit'
    });
    var j = await r.json();
    if (j.code && j.code !== 200) throw new Error(j.errorMessage || 'Error de PlayFab ' + j.code);
    return j.data || {};
  }
  async function playFabToken() {
    var device = 'pfid_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    var login = await pf('/Client/LoginWithIOSDeviceID',
      { CreateAccount: true, TitleId: '20CA2', DeviceId: device, OS: 'IOS' });
    var ent = await pf('/Authentication/GetEntityToken',
      { Entity: { Id: login.PlayFabId, Type: 'master_player_account' } },
      login.EntityToken && login.EntityToken.EntityToken);
    return ent.EntityToken;
  }

  async function loadApp() {
    var data = await api('getAddon', { id: rawId, lang: lang });
    var a = data.addon || {};
    return {
      nombre: a.nombre || 'Sin nombre',
      version: a.version || '', creador: a.subidoPor || 'Prizmothyn',
      categoria: a.categoria || 'Addons', likes: Number(a.likes) || 0,
      descargas: Number(a.descargas) || 0, fecha: a.fecha || '',
      imagen: '', imagenes: (Array.isArray(a.imagenes) ? a.imagenes : []).map(safeUrl).filter(Boolean),
      descripcion: a.descripcion || '',
      traducido: !!a.descripcionTraducida,
      urlDescarga: safeUrl(a.urlDescarga), variantes: []
    };
  }
  async function loadMarket() {
    if (!/^[A-Za-z0-9-]+$/.test(rawId)) throw new Error('El ID del addon no es válido.');
    var token = await playFabToken();
    var data = await pf('/Catalog/Search', {
      count: true, filter: "id eq '" + rawId + "'", scid: SCID,
      select: 'contents,images', top: 1, skip: 0, orderBy: 'startDate DESC'
    }, token);
    var raw = (Array.isArray(data.Items) ? data.Items : []).filter(function (x) {
      return String(x.Id) === rawId;
    })[0];
    if (!raw) throw new Error('No se encontró el addon en el Marketplace.');
    var it = normalizeMarket(raw);
    it.traducido = false;
    if (lang === 'es' && it.descripcion) {
      try {
        var tr = await api('translateDescription', { text: it.descripcion, to: 'es' });
        if (tr.texto) { it.descripcion = tr.texto; it.traducido = !!tr.traducido; }
      } catch (e) { /* mostramos el texto original */ }
    }
    return it;
  }

  function render() {
    if (!item) return;
    document.title = item.nombre + ' · Prizmothyn';
    var imgs = (item.imagenes || []).slice();
    if (!imgs.length && item.imagen) imgs.push(item.imagen);
    var gallery = imgs.length
      ? '<div class="gallery-main" id="galleryMain"><img src="' + imgs[0] + '" alt=""></div>' +
        (imgs.length > 1 ? '<div class="thumbs">' + imgs.map(function (u, i) {
          return '<button class="thumb' + (i ? '' : ' active') + '" type="button" data-thumb="' + i +
            '" aria-label="Ver imagen ' + (i + 1) + '"><img src="' + u + '" alt=""></button>';
        }).join('') + '</div>' : '')
      : '<div class="gallery-empty">Sin imágenes disponibles</div>';
    var meta = '<div class="meta"><span class="chip">' + esc(item.categoria || 'Contenido') + '</span>' +
      (item.version ? '<span>Versión ' + esc(item.version) + '</span>' : '') +
      '<span>por ' + esc(item.creador) + '</span>' +
      (item.fecha ? '<span>' + esc(dateLabel(item.fecha)) + '</span>' : '') +
      '<span>❤️ ' + fmt(item.likes) + '</span><span>⬇️ ' + fmt(item.descargas) + '</span></div>';
    var badge = item.traducido
      ? '<span class="translated">🌐 ' + (lang === 'en' ? 'Translated to English' : 'Traducido al español') + '</span>'
      : '';
    var desc = item.descripcion
      ? '<div class="description">' + esc(item.descripcion) + '</div>'
      : '<p class="no-desc">Sin descripción disponible.</p>';
    var action = '<button class="download-btn" id="downloadBtn" type="button">⬇️ Descargar</button>' +
      '<div class="status" id="status"></div>';
    $('#content').innerHTML = '<div class="detail"><h1>' + esc(item.nombre) + '</h1>' +
      meta + gallery + badge + desc + action + '</div>';
    $('#downloadBtn').addEventListener('click', download);
    $$('[data-thumb]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var i = Number(btn.getAttribute('data-thumb'));
        if (!imgs[i]) return;
        var main = $('#galleryMain');
        if (main) main.innerHTML = '<img src="' + imgs[i] + '" alt="">';
        $$('[data-thumb]').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
      });
    });
  }
  function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function status(text) {
    var el = $('#status');
    if (!el) return;
    el.textContent = text || '';
    el.classList.toggle('busy', !!text);
  }
  function pause(ms) {
    return new Promise(function (resolve) { window.setTimeout(resolve, ms); });
  }

  function getWorker() {
    if (worker) return worker;
    worker = new Worker(WORKER_URL, { type: 'module' });
    worker.onmessage = function (e) {
      var d = e.data || {}, p = pending.get(d.id);
      if (!p) return;
      if (d.type === 'PROGRESS') { p.onProgress && p.onProgress(d.payload); return; }
      pending.delete(d.id);
      if (d.type === 'ERROR') p.reject(new Error(d.error || 'Error del worker'));
      else p.resolve({ type: d.type, payload: d.payload || {} });
    };
    worker.onerror = function (e) {
      pending.forEach(function (p) { p.reject(new Error(e.message || 'Error del worker')); });
      pending.clear(); worker = null;
    };
    return worker;
  }
  function callWorker(type, payload, transfer, onProgress) {
    var w = getWorker(), id = ++workerSeq;
    return new Promise(function (resolve, reject) {
      pending.set(id, { resolve: resolve, reject: reject, onProgress: onProgress });
      w.postMessage({ id: id, type: type, payload: payload }, transfer || []);
    });
  }
  // Las claves pesan ~1,2 MB y el servidor puede ser lento: se cargan una sola
  // vez por página y se aprovecha la caché HTTP del navegador/CDN.
  async function loadKeys() {
    if (keysPromise) return keysPromise;
    keysPromise = (async function () {
      status('Obteniendo claves de descarga…');
      var slow = window.setTimeout(function () {
        status('El servidor de claves está tardando más de lo normal…');
      }, 5000);
      try {
        var r = await fetch(KEYS_URL, { credentials: 'omit' });
        if (!r.ok) throw new Error('No se pudieron cargar las claves (HTTP ' + r.status + ')');
        var key = r.headers.get('X-Decryption-Key') || r.headers.get('x-decryption-key') || '';
        status('Preparando motor de descarga…');
        var buf = await r.arrayBuffer();
        var res = await callWorker('LOAD_KEYS_ENCRYPTED', { encryptedBuffer: buf, key: key }, [buf]);
        var set = new Set();
        (res.payload.ownedUuids || []).forEach(function (id) { set.add(String(id).trim().toLowerCase()); });
        return set;
      } catch (e) {
        keysPromise = null;
        throw e;
      } finally {
        window.clearTimeout(slow);
      }
    })();
    return keysPromise;
  }

  function progressText(p) {
    p = p || {};
    var prefix = p.part && p.totalParts > 1 ? '[Parte ' + p.part + '/' + p.totalParts + '] ' : '';
    if (p.stage === 'connecting') return prefix + 'Conectando con el servidor de archivos…';
    if (p.stage === 'downloading') {
      var mb = (Number(p.receivedBytes || 0) / 1048576).toFixed(1);
      var total = p.totalBytes ? ' / ' + (Number(p.totalBytes) / 1048576).toFixed(1) + ' MB' : '';
      var pct = p.percent ? ' · ' + Math.round(p.percent) + '%' : '';
      var speed = p.speedBytesPerSec
        ? ' · ' + (Number(p.speedBytesPerSec) / 1048576).toFixed(2) + ' MB/s'
        : '';
      return prefix + 'Descargando ' + mb + ' MB' + total + pct + speed;
    }
    if (p.stage === 'decrypting') return prefix + 'Descifrando y preparando el archivo…';
    return prefix + (p.message || 'Procesando…');
  }
  function filenameFromUrl(url, name) {
    try {
      var part = new URL(url).pathname.split('/').filter(Boolean).pop();
      if (part) return decodeURIComponent(part);
    } catch (e) { /* URL relativa */ }
    return String(name || 'archivo').replace(/[^\w.\-() ]+/g, '_') + '.zip';
  }
  function base64ToBytes(b64) {
    var bin = atob(String(b64 || '').replace(/\s/g, ''));
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function saveBlob(bytes, filename) {
    var url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
    var trigger = document.createElement('a');
    trigger.href = url; trigger.download = filename; trigger.style.display = 'none';
    document.body.appendChild(trigger); trigger.click(); trigger.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    var el = $('#status');
    if (el) el.classList.remove('busy');
    if (el) el.innerHTML = 'Descarga lista: ' + esc(filename) +
      ' · <a href="' + esc(url) + '" download="' + esc(filename) + '">💾 Guardar de nuevo</a>';
  }
  async function downloadApp() {
    var url = item.urlDescarga;
    if (!url) throw new Error('Este contenido no tiene enlace de descarga.');
    status('Verificando el archivo en el servidor…');
    try {
      var data = await api('downloadFile', { id: rawId, url: url });
      var bytes = base64ToBytes(data.base64 || '');
      if (!bytes.length) throw new Error('Archivo vacío');
      saveBlob(bytes, data.filename || filenameFromUrl(url, item.nombre));
      api('descargarAddon', { id: rawId }).catch(function () {});
    } catch (e) {
      status('Preparando descarga directa…');
      var link = document.createElement('a');
      link.href = url; link.download = filenameFromUrl(url, item.nombre);
      document.body.appendChild(link); link.click(); link.remove();
    }
  }
  async function downloadMarket() {
    await loadKeys();
    var urls = (item.variantes && item.variantes[0]) || [];
    if (!urls.length) throw new Error('Sin archivos de descarga');
    var res = null, lastError = null;
    var needsProxy = urls.some(function (u) { return /xboxlive\.com/i.test(u); });
    var prefixes = needsProxy ? ['https://toolcoin.site/api/proxy.php'] : ['', 'https://toolcoin.site/api/proxy.php'];
    for (var i = 0; i < prefixes.length; i++) {
      status((i && !needsProxy) ? 'Conexión directa bloqueada, usando proxy…' : 'Conectando con el servidor de archivos…');
      var firstProgress = true;
      var slow = window.setTimeout(function () {
        status('La conexión con el servidor de archivos está tardando…');
      }, 5000);
      try {
        res = await callWorker('DOWNLOAD_AND_PROCESS', {
          downloadUrls: urls, title: item.nombre, variantLabel: '', proxyPrefix: prefixes[i]
        }, [], function (p) {
          if (firstProgress) { firstProgress = false; window.clearTimeout(slow); }
          status(progressText(p));
        });
        break;
      } catch (err) { lastError = err; }
      finally { window.clearTimeout(slow); }
    }
    if (!res) throw lastError || new Error('No se pudo descargar el archivo');
    status('Descarga completada, guardando archivo…');
    await pause(150);
    saveBlob(res.payload.data, res.payload.filename || (item.nombre + '.zip'));
  }
  async function download() {
    var btn = $('#downloadBtn');
    if (btn) btn.disabled = true;
    status('Verificando conexión con el servidor…');
    await pause(150);
    try {
      if (source === 'app') await downloadApp();
      else await downloadMarket();
    } catch (e) {
      var msg = (e && e.message) || '';
      status(/fetch|network|cors|failed/i.test(msg)
        ? 'No se pudo descargar. Revisa tu conexión e inténtalo de nuevo.'
        : 'Error: ' + msg);
    } finally { if (btn) btn.disabled = false; }
  }

  function showError(message) {
    $('#content').innerHTML = '<div class="state"><h1>No se pudo cargar el addon</h1>' +
      '<p>' + esc(message || 'Inténtalo de nuevo en unos segundos.') + '</p>' +
      '<a class="back-btn" href="index.html#catalogo">Volver al catálogo</a></div>';
  }

  // Volver al catálogo por el historial mantiene viva la vista anterior.
  // Si la ficha se abrió directamente, caemos al enlace normal.
  document.addEventListener('click', function (e) {
    var back = e.target.closest && e.target.closest('.back-btn[href="index.html#catalogo"]');
    if (back && document.referrer && /index\.html/i.test(document.referrer) && history.length > 1) {
      e.preventDefault();
      history.back();
    }
  });

  var switchLink = $('#langSwitch');
  if (idParam) {
    switchLink.href = 'ID.html?ID=' + encodeURIComponent(idParam) + '&lang=' + (lang === 'es' ? 'en' : 'es');
    switchLink.textContent = lang === 'es' ? 'Español' : 'English';
    // location.replace evita añadir otra entrada al historial al cambiar idioma.
    switchLink.addEventListener('click', function (e) {
      e.preventDefault();
      location.replace(switchLink.href);
    });
  } else {
    switchLink.remove();
  }

  if (!idParam) {
    showError('Falta el ID del addon. Abre un complemento desde el catálogo.');
  } else {
    (source === 'app' ? loadApp() : loadMarket())
      .then(function (data) { item = data; render(); })
      .catch(function (e) { showError((e && e.message) || 'Error desconocido'); });
  }
})();
</script>
</body>
